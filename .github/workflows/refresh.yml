name: Refresh data

# Vahan (vahan.ms) rebuilds around 04:00 IST. This runs at 07:30 IST every day.
# On the 1st to 5th of the month it also reads last month's dispatch filings from NSE.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pypdf

      - name: Pull latest Vahan registrations
        run: python3 pipeline/refresh.py vahan

      - name: Read last month's dispatches from NSE (first days of the month only)
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event.schedule && true)) }}
        continue-on-error: true
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" -le 5 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PREV=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)
            echo "Reading dispatches for $PREV"
            python3 pipeline/refresh.py dispatch "$PREV"
          else
            echo "Day $DAY: not the start of the month, skipping dispatch filings."
          fi

      - name: Rebuild index.html
        run: python3 pipeline/refresh.py build

      - name: Commit and publish if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pipeline/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh data $(date -u +%Y-%m-%d)"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages build request skipped"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
