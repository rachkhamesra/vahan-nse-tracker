name: Refresh NSE dispatches

# Registrations come from the official VAHAN dashboard, which refuses GitHub's servers, so they are pulled by the
# scheduled job on the owner's Mac (pipeline/mac/) and pushed here. This workflow handles only the monthly NSE
# dispatch filings. It runs every day and only does work on the 1st to 5th of the month.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  dispatches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pypdf

      - name: Read last month's dispatches from NSE
        continue-on-error: true
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" -le 5 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PREV=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)
            echo "Reading dispatches for $PREV"
            python3 pipeline/refresh.py dispatch "$PREV"
            python3 pipeline/refresh.py output "$PREV"
          else
            echo "Day $DAY: not the start of the month, nothing to read."
          fi

      - name: Publish and commit if anything changed
        run: |
          python3 pipeline/refresh.py publish --only dispatch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dispatch.json data/output.json pipeline/data/dispatch.json pipeline/data/output.json
          if git diff --cached --quiet; then
            echo "No dispatch changes."
          else
            git commit -m "Dispatch data $(date -u +%Y-%m-%d)"
            git pull -q --rebase
            git push
          fi
